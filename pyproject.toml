[project]
name = "jpq"
version = "0.1.5"
description = "jq-style JSON filtering with Python expressions."
requires-python = ">=3.13"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Airat Valiullin", email = "me@airatvaliullin.com" }]
keywords = ["jq", "json", "filter", "transform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "click>=8.3.3",
    "rich>=15.0.0",
    "rich-click>=1.9.7",
]

[project.urls]
Homepage = "https://github.com/rayannott/jpq"
Repository = "https://github.com/rayannott/jpq"
Issues = "https://github.com/rayannott/jpq/issues"

[project.scripts]
jpq = "jpq.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that build the wheel and install jpq into a throwaway venv",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
allow_untyped_decorators = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
